  <g transform="translate(0,10)" filter="url(#shadow)">
    <path d="M256 120c-28 0-60 20-76 44-12 18-18 36-18 56 0 28 8 48 18 64 10 16 28 30 56 30s46-14 56-30c10-16 18-36 18-64 0-20-6-38-18-56-16-24-48-44-76-44z" fill="#fff"/>
