  </g>

  <!-- Text -->
  <g transform="translate(0,330)">
    <text x="50%" y="0" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="44" fill="#ffffff">Protesica</text>
    <text x="50%" y="44" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="600" font-size="26" fill="#e6f0ff">Tepepan</text>
